<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0505"/>
      <stop offset="45%" stop-color="#7A0E0E"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2A900" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0.20"/>
    </linearGradient>
    <radialGradient id="arc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BFF8FF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#4FD1C5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>

  <circle cx="600" cy="88" r="120" fill="url(#arc)" opacity="0.35">
    <animate attributeName="opacity" values="0.25;0.45;0.25" dur="4s" repeatCount="indefinite"/>
  </circle>

  <path fill="url(#wave1)" d="M0,190 C200,150 400,230 600,190 C800,150 1000,230 1200,190 L1200,240 L0,240 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,190 C200,150 400,230 600,190 C800,150 1000,230 1200,190 L1200,240 L0,240 Z;
              M0,200 C200,240 400,150 600,200 C800,240 1000,150 1200,200 L1200,240 L0,240 Z;
              M0,190 C200,150 400,230 600,190 C800,150 1000,230 1200,190 L1200,240 L0,240 Z"/>
  </path>
  <path fill="#3D0808" opacity="0.6" d="M0,210 C300,180 500,240 700,210 C900,185 1100,235 1200,210 L1200,240 L0,240 Z">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0,210 C300,180 500,240 700,210 C900,185 1100,235 1200,210 L1200,240 L0,240 Z;
              M0,215 C300,240 500,180 700,215 C900,240 1100,185 1200,215 L1200,240 L0,240 Z;
              M0,210 C300,180 500,240 700,210 C900,185 1100,235 1200,210 L1200,240 L0,240 Z"/>
  </path>

  <text x="600" y="105" text-anchor="middle" fill="#FFD166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="1">
    Tamir Sobuh
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="600" y="145" text-anchor="middle" fill="#FBE3B5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="500" letter-spacing="3">
    SOFTWARE ENGINEERING STUDENT&#160;&#160;|&#160;&#160;QA &amp; SECURITY
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.4s" fill="freeze"/>
  </text>
</svg>
