<svg width="950" height="110" viewBox="0 0 950 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="armor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="55%" stop-color="#9E1414"/>
      <stop offset="100%" stop-color="#5C0A0A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD97A"/>
      <stop offset="50%" stop-color="#F2A900"/>
      <stop offset="100%" stop-color="#B87D00"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#BFF8FF"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="palmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#BFF8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hitFlash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#BFF8FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#BFF8FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ================= HELMET (front view) ================= -->
  <g>
    <!-- outer red shell -->
    <path fill="url(#armor)" d="M24,32 Q24,6 54,6 Q84,6 84,32 L84,62 Q84,80 68,92 L40,92 Q24,80 24,62 Z"/>
    <!-- shell shading -->
    <path fill="#420707" opacity="0.45" d="M74,14 Q84,22 84,32 L84,62 Q84,80 68,92 L61,92 Q78,78 78,56 L78,22 Z"/>
    <!-- gold faceplate -->
    <path fill="url(#gold)" d="M33,40 Q39,26 54,26 Q69,26 75,40 L75,58 Q75,74 63,84 L45,84 Q33,74 33,58 Z"/>
    <!-- angular brow lines -->
    <path d="M36,43 L51,39.5" stroke="#8C6100" stroke-width="2.2" fill="none"/>
    <path d="M72,43 L57,39.5" stroke="#8C6100" stroke-width="2.2" fill="none"/>
    <!-- eyes: sharp angled slits -->
    <polygon points="37,47 51,44.5 51,50.5 37,52" fill="#EAFDFF"/>
    <polygon points="57,44.5 71,47 71,52 57,50.5" fill="#EAFDFF"/>
    <ellipse cx="44" cy="48.2" rx="8" ry="3.4" fill="url(#eyeGlow)" opacity="0.75">
      <animate attributeName="opacity" values="0.45;0.9;0.45" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="64" cy="48.2" rx="8" ry="3.4" fill="url(#eyeGlow)" opacity="0.75">
      <animate attributeName="opacity" values="0.45;0.9;0.45" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- nose bridge panel -->
    <path d="M52,52 L56,52 L55,62 L53,62 Z" fill="#B87D00" opacity="0.45"/>
    <!-- cheek panel lines -->
    <path d="M41,60 L41,68 L46,72" stroke="#8C6100" stroke-width="1.6" fill="none" opacity="0.8"/>
    <path d="M67,60 L67,68 L62,72" stroke="#8C6100" stroke-width="1.6" fill="none" opacity="0.8"/>
    <!-- mouth slit -->
    <rect x="45" y="68" width="18" height="3.2" rx="1" fill="#6B4A00"/>
    <!-- angular chin line -->
    <path d="M45,78 L54,80.5 L63,78" stroke="#8C6100" stroke-width="1.8" fill="none"/>
    <!-- jaw hinges -->
    <circle cx="29" cy="54" r="3" fill="url(#gold)"/>
    <circle cx="79" cy="54" r="3" fill="url(#gold)"/>
  </g>

  <!-- ================= GAUNTLET (fires every 4s) ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite"
      values="0,0; -6,0; 0,0; 0,0" keyTimes="0;0.06;0.14;1"/>
    <!-- forearm -->
    <rect x="104" y="42" width="64" height="30" rx="10" fill="url(#armor)"/>
    <rect x="110" y="47" width="46" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="110" y="62" width="46" height="4" rx="2" fill="url(#gold)" opacity="0.85"/>
    <!-- wrist plate -->
    <rect x="164" y="45" width="16" height="24" rx="6" fill="url(#gold)"/>
    <!-- hand -->
    <circle cx="190" cy="57" r="16" fill="url(#armor)"/>
    <rect x="186" y="38" width="10" height="10" rx="4" fill="#9E1414"/>
    <rect x="186" y="66" width="10" height="10" rx="4" fill="#9E1414"/>
    <!-- palm repulsor -->
    <circle cx="198" cy="57" r="14" fill="url(#palmGlow)">
      <animate attributeName="r" dur="4s" repeatCount="indefinite"
        values="8;20;10;8" keyTimes="0;0.08;0.2;1"/>
    </circle>
    <circle cx="198" cy="57" r="6" fill="#FFFFFF">
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
        values="0.7;1;0.7;0.7" keyTimes="0;0.08;0.2;1"/>
    </circle>
  </g>

  <!-- repulsor beam -->
  <rect x="212" y="52" height="10" rx="5" fill="url(#beam)" width="0">
    <animate attributeName="width" dur="4s" repeatCount="indefinite"
      values="0;90;44;0;0" keyTimes="0;0.05;0.1;0.16;1"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
      values="0;1;0.8;0;0" keyTimes="0;0.05;0.1;0.16;1"/>
  </rect>

  <!-- impact flash where the text appears -->
  <circle cx="275" cy="57" r="30" fill="url(#hitFlash)" opacity="0">
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
      values="0;0;1;0;0" keyTimes="0;0.05;0.09;0.2;1"/>
  </circle>

  <!-- the four lines, one per blast -->
  <g font-family="'Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="27" font-weight="600" fill="#FFD166">
    <text x="275" y="66" opacity="0">Software Engineering Student @ Shenkar
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
        values="0;1;1;0;0" keyTimes="0;0.02;0.21;0.24;1"/>
      <animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite"
        values="24,0;0,0;0,0" keyTimes="0;0.02;1"/>
    </text>
    <text x="275" y="66" opacity="0">3 Years QA &amp; Validation @ Intel
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.46;0.49;1"/>
      <animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite"
        values="24,0;24,0;0,0;0,0" keyTimes="0;0.25;0.27;1"/>
    </text>
    <text x="275" y="66" opacity="0">Network Security &amp; Traffic Analysis
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.71;0.74;1"/>
      <animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite"
        values="24,0;24,0;0,0;0,0" keyTimes="0;0.5;0.52;1"/>
    </text>
    <text x="275" y="66" opacity="0">Full Stack Development
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.96;0.99;1"/>
      <animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite"
        values="24,0;24,0;0,0;0,0" keyTimes="0;0.75;0.77;1"/>
    </text>
  </g>
</svg>
